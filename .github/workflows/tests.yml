name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**.py'
      - 'scripts/**.json'
      - 'scripts/**.sh'
      - 'scripts/tests/**'
      - 'futbolbase.db'
      - 'data-*.js'
      - 'src/**'
      - 'index.html'
      - 'acta.css'
      - 'sw.js'
      - 'manifest.json'
      - 'fonts/**'
      - 'icons/**'
      - 'escudos/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/update.yml'
  pull_request:
    paths:
      - 'scripts/**.py'
      - 'scripts/**.json'
      - 'scripts/**.sh'
      - 'scripts/tests/**'
      - 'futbolbase.db'
      - 'data-*.js'
      - 'src/**'
      - 'index.html'
      - 'acta.css'
      - 'sw.js'
      - 'manifest.json'
      - 'fonts/**'
      - 'icons/**'
      - 'escudos/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/update.yml'
  # Red de seguridad: los push del bot con GITHUB_TOKEN no disparan este
  # workflow (anti-recursión de GitHub), así que un cron diario garantiza
  # que las suites corren sobre main al menos una vez al día.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

# Las acciones, en la versión mayor más baja que corre en Node 24 (plan B4, decisiones 12 y 55; lo fija
# test_workflows.py): checkout@v5, setup-python@v6 y setup-node@v5, como update.yml; y la imagen,
# fijada en ubuntu-24.04, como en todos los workflows.
jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest pyyaml
      - name: Run Python tests
        run: python -m pytest scripts/tests/ -v

  node-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run Node tests
        # Glob (contrato C5): coge todas las suites test_*.mjs presentes y
        # futuras (render-smoke.mjs no matchea, corre en su propio job).
        run: node --test scripts/tests/test_*.mjs

  render-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.58.0
      - name: Render smoke (headless Chrome; the D state with Playwright)
        run: node scripts/tests/render-smoke.mjs
      - name: Interaction smoke (headless Chrome)
        run: node scripts/tests/interaction-smoke.mjs
      - name: PWA update and offline smoke
        run: node scripts/tests/pwa-smoke.mjs
