name: Actualización automática

# Las pasadas del bot: pasadas cortas (la federación bloquea más cada vez dentro de una pasada y cada
# ejecución tiene IP nueva: docs/federacion.md). Desde el 17/10/2026 no tiene cron: las lanza el reloj
# (reloj.yml, scripts/reloj_pasadas.py) cada 2 h (update_fiflp.PASS_EVERY) y cada hora en las ventanas de
# partidos (viernes de 18 a 24 y sábado y domingo de 10 a 24, hora de Canarias), nunca con otra sin acabar;
# también las tandas de la federación al subir sus raw (actas-federacion.yml, goleadores-federacion.yml y
# detalle-federacion.yml), y a mano. Su cron ('23 */2 * * *' desde el 16/10/2026; '0 */6 * * *' antes) casi
# no llegaba: 5 de 13 en ~26 h, una pasada cada 4-6 h. El reloj es otro workflow, y no un job «¿toca?» aquí,
# porque cada ejecución de update.yml, aunque no haga nada, sube GITHUB_RUN_NUMBER, del que sale el orden de
# cada pasada (update_fiflp.run_number): así solo sube en pasadas de verdad.
on:
  workflow_dispatch:          # el reloj (reloj.yml), las tandas de la federación y a mano desde GitHub

permissions:
  contents: write
  issues: write     # una issue por competición nueva de la federación (avisar_competiciones.py)

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # La imagen fijada y las acciones en Node 24, como tests.yml (plan B4, decisión 55; test_workflows.py).
    runs-on: ubuntu-24.04
    # 40: los grupos de la federación se leen con navegador (~7 s por página, fiflp_carga.py) y la
    # federación sirve ~15 páginas por IP antes de frenar, cada vez más (~5 min, ~15 y más; pasadas
    # 1107-1110). Cada pasada espera solo el primer freno y acaba en el segundo (~9 min); su plazo global
    # es de 16 min para una pasada sin freno (update_fiflp.DEADLINE_SECONDS; la espera del freno cabe
    # dentro, y ninguna página empieza después): con preparación, app, importaciones, generate_js, pruebas
    # y commit (4-8 min), 20-24 min, ~26 en el peor caso. Hasta el 16/10/2026, 55 (33 min de plazo).
    timeout-minutes: 40

    steps:
      # ref: main, el main de AHORA: un workflow_dispatch en cola (las tandas de actas lanzan el bot)
      # trabaja por defecto sobre el commit del momento en que se lanzó, y al arrancar tras otra pasada
      # se pisaba con la base que ella subió (4/10/2026: conflicto en futbolbase.db).
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias de test
        run: pip install pytest pyyaml

      # Desde 2026/27 los grupos vienen de la federación (FIFLP), que solo
      # responde a un navegador y no a IPs domésticas: update_fiflp.py.
      - name: Instalar Playwright (grupos de la federación)
        run: |
          pip install playwright
          playwright install chromium --with-deps

      # Diagnóstico del freno de la federación (15/10/2026): la IP pública del runner, que cambia de una
      # ejecución a otra, para cruzar los frenos del log (esperas del freno, «no sirve páginas») con las IPs.
      # Solo en el log (no va a data-health.json), sin secretos ni datos del usuario, y nunca para el job:
      # 5 s como mucho y, sin respuesta, «desconocida».
      - name: IP pública del runner
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "IP pública del runner: $(curl -s --max-time 5 https://api.ipify.org || echo desconocida)"

      - name: Actualizar datos desde futbolaspalmas.com y la federación
        id: scrape
        continue-on-error: true
        env:
          FIFLP_UPDATE: '1'
          # Sin búfer: cada línea del log con su hora (el coste de cada grupo de la federación).
          PYTHONUNBUFFERED: '1'
          # update_fiflp deja aquí una marca cuando cambia en la base estado suyo que no se publica
          # (la primera pasada completa de un grupo recién activado): el commit sube la base también entonces.
          FIFLP_DB_MARK: ${{ runner.temp }}/base-cambiada
        run: python3 scripts/fetch_futbolaspalmas.py

      # Competiciones de la federación que la web no tiene (newCompetitions de data-health.json, que
      # escribe update_fiflp.check_competitions): una issue por cada una, sin repetirla (busca su
      # código también en las cerradas). Solo el nombre y el código de la competición. Nunca para el bot.
      - name: Avisar de competiciones nuevas
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/avisar_competiciones.py

      # Los push del bot (GITHUB_TOKEN) NO disparan tests.yml (anti-recursión
      # de GitHub), así que las suites tienen que correr AQUÍ, sobre los datos
      # recién generados y ANTES del commit: si fallan, el job sale rojo y no
      # se publica nada.
      - name: Tests Python (bloquean el commit si fallan)
        if: steps.scrape.outcome == 'success'
        run: python3 -m pytest scripts/tests/ -q

      - name: Tests Node (bloquean el commit si fallan)
        if: steps.scrape.outcome == 'success'
        run: node --test scripts/tests/test_*.mjs

      - name: Commit y push si hay cambios
        if: success() && steps.scrape.outcome == 'success'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # generate_js.py escribe data-*.js (incl. data-seasons.js y
          # data-season-*.js), bumpea ?v= en index.html y CACHE_NAME en sw.js.
          # futbolbase.db cambia de bytes (cabecera SQLite) en CADA run aunque
          # no cambie ningún dato publicado: se gatea su commit a que cambie
          # algún artefacto publicado (evita ~13/14 commits de ruido), o a la
          # marca de update_fiflp (FIFLP_DB_MARK, en el paso scrape).
          git add 'data-*.js' index.html sw.js
          if ! git diff --cached --quiet || [ -f "$RUNNER_TEMP/base-cambiada" ]; then
            git add futbolbase.db
            # El raw de la app de futbolaspalmas (qué días ya están leídos) va con los datos que ha dado.
            git add 'scripts/fp_app_*_raw.json' 2>/dev/null || true
          fi
          # La comprobación de fuentes se publica aunque el marcador no cambie.
          git add data-health.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualización automática $(date '+%d/%m/%Y %H:%M UTC')"
            # El run dura hasta ~25 min: si alguien ha empujado a main
            # mientras tanto (una tanda de la federación sube su raw), se
            # rebasa y se reintenta. Dos pasadas seguidas no se pisan: la
            # concurrency update-data las pone en fila y cada una parte del
            # main de cuando arranca (checkout ref: main). Un conflicto (la
            # base tocada en los dos lados) aborta en rojo; la pasada
            # siguiente (1-2 h después: reloj.yml) lo rehace.
            for intento in 1 2 3; do
              if git push; then break; fi
              if [ "$intento" = 3 ]; then exit 1; fi
              # --autostash: la importación de actas deja cambios sin subir (fiflp_actas_unmatched.json)
              # y sin él git se niega a rebasar (4/10/2026: «You have unstaged changes»).
              git pull --rebase --autostash origin main || { git rebase --abort; echo "conflicto con main: se rehará en la próxima pasada"; exit 1; }
            done
          fi

      - name: Publicar diagnóstico si la fuente falla
        if: steps.scrape.outcome == 'failure'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # No se publican datos deportivos parciales de una ejecución fallida, ni sus comprobaciones
          # correctas (source_health.finish(failed=True)): solo sus errores.
          git add data-health.json
          if ! git diff --cached --quiet; then
            git commit -m "Estado de las fuentes $(date '+%d/%m/%Y %H:%M UTC')"
            # Como el commit de datos: si main se ha movido (otra subida en el rato del bot), se rebasa y
            # se reintenta; un conflicto se deja para la pasada siguiente (1-2 h después: reloj.yml).
            for intento in 1 2 3; do
              if git push; then break; fi
              if [ "$intento" = 3 ]; then break; fi
              git pull --rebase --autostash origin main || { git rebase --abort; echo "conflicto con main: se rehará en la próxima pasada"; break; }
            done
          fi
          exit 1
